name: SEO agent

on:
  schedule:
    # 13:40 UTC daily: off the hour (GitHub delays on-the-hour cron), and two
    # hours after the blog agent so the two never push to main at once.
    - cron: '40 13 * * *'
  workflow_dispatch:
    inputs:
      weekly:
        description: 'Run the weekly checks now (Lighthouse, AI search, external links)'
        type: boolean
        default: false
      dry_run:
        description: 'Report only: no commits, no IndexNow, no issue update'
        type: boolean
        default: false

permissions:
  contents: write   # regenerated files to main, history to seo-agent-data
  issues: write     # the rolling report issue
  pages: write      # ask Pages to build after the agent pushes
  pull-requests: write  # ready-to-merge page fixes (needs the repo to allow Actions PRs)

concurrency:
  group: aquamesh-seo-agent
  cancel-in-progress: false

jobs:
  seo:
    # Off switch: repository variable SEO_AGENT=off. Report-only: SEO_AGENT_AUTOFIX=off.
    if: vars.SEO_AGENT != 'off'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # sitemap lastmod comes from git history

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Test the agent's rules and guardrails
        run: node --test .github/scripts/seo/seo.test.mjs

      - name: Check out run history (seo-agent-data branch)
        run: |
          D="$RUNNER_TEMP/seo-data"
          if git ls-remote --exit-code --heads origin seo-agent-data >/dev/null; then
            git fetch -q origin seo-agent-data:seo-agent-data
            git worktree add -q "$D" seo-agent-data
          else
            git worktree add -q --detach "$D"
            git -C "$D" checkout -q --orphan seo-agent-data
            git -C "$D" rm -rfq .
          fi
          echo "SEO_DATA=$D" >> "$GITHUB_ENV"

      - name: Run the SEO agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEO_AGENT_AUTOFIX: ${{ vars.SEO_AGENT_AUTOFIX }}
        run: |
          ARGS="--data-dir $SEO_DATA"
          if [ "${{ inputs.weekly }}" = "true" ]; then ARGS="$ARGS --weekly"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          node .github/scripts/seo-agent.mjs $ARGS

      - name: Save run history
        if: success() && inputs.dry_run != true
        run: |
          cd "$SEO_DATA"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="AquaMesh SEO Agent" -c user.email=actions@users.noreply.github.com \
            commit -qm "SEO agent run $(date -u +%F)"
          for i in 1 2 3; do
            git push -q origin HEAD:seo-agent-data && exit 0
            git pull -q --rebase origin seo-agent-data
          done
          exit 1
