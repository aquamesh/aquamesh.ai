name: Publish approved AquaMesh DEV articles
on:
  push:
    branches: [main]
    paths:
      - '_growth/dev/pending/*.json'
      - '.github/workflows/publish-dev.yml'
      - '.github/scripts/dev-publisher.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aquamesh-dev-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check publishing credential
        id: credential
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          if [ -n "$DEVTO_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "DEV publishing inactive: credential not configured"
          fi
      - name: Publish and verify
        if: steps.credential.outputs.available == 'true'
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: node .github/scripts/dev-publisher.mjs
      - name: Record live URLs
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard _growth/dev/published)" ]; then exit 0; fi
          git config user.name "AquaMesh Growth Agent"
          git config user.email "actions@users.noreply.github.com"
          git add _growth/dev/published
          git commit -m "Record verified DEV publications"
          git push
