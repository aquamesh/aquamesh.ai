name: Daily AquaMesh blog agent

on:
  schedule:
    # 11:20 UTC daily. Offset from the hour on purpose: GitHub's scheduler
    # queues heavily on the hour and delays those runs.
    - cron: '20 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Research and draft, but write nothing and commit nothing'
        type: boolean
        default: false

permissions:
  contents: write

# Shares no state with the DEV publisher, but must not race it: both commit
# to main, and a concurrent push loses.
concurrency:
  group: aquamesh-blog-agent
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Check publishing credential
        id: credential
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Blog agent inactive: ANTHROPIC_API_KEY is not configured as a repository secret."
          fi

      - name: Research, draft, and gate
        if: steps.credential.outputs.available == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node .github/scripts/blog-agent.mjs --dry-run
          else
            node .github/scripts/blog-agent.mjs
          fi

      # The agent declines on most days, is rate-limited to two posts per
      # rolling week, and drops anything that fails its gates. All three of
      # those outcomes leave the tree clean, which is the normal case.
      - name: Commit the post
        if: steps.credential.outputs.available == 'true' && inputs.dry_run != true
        run: |
          # A new post is an UNTRACKED file, so git diff alone never sees it.
          NEW=$(git ls-files --others --exclude-standard -- blog/posts)
          if [ -z "$NEW" ]; then
            echo "Nothing to commit: the agent declined, was rate-limited, or failed its gates."
            exit 0
          fi
          if [ "$(echo "$NEW" | wc -l)" -ne 1 ]; then
            echo "Expected exactly one new post, got:"
            echo "$NEW"
            exit 1
          fi
          SLUG=$(echo "$NEW" | sed 's#blog/posts/##; s#\.md$##')
          git config user.name "AquaMesh Blog Agent"
          git config user.email "actions@users.noreply.github.com"
          git add blog feed.xml sitemap.xml robots.txt llms.txt llms-full.txt
          git commit -m "Blog agent: publish ${SLUG}"
          git push
