<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AquaMesh for AB InBev, Coca-Cola and Mondelez</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
.sl{display:none;position:absolute;left:50%;top:50%;width:1280px;height:720px;background:#fff}
.sl.on{display:block}
.sl>img{display:block;width:1280px;height:720px;user-select:none;-webkit-user-drag:none}
.vid{position:absolute;border-radius:14px;overflow:hidden;background:#0b1026}
.vid video{display:block;width:100%;height:100%;object-fit:cover;background:#0b1026}
.vid.big{left:40px!important;top:22px!important;width:1200px!important;height:675px!important;z-index:5;border-radius:16px}
.grow{position:absolute;right:10px;top:10px;z-index:2;border:0;border-radius:99px;background:rgba(255,255,255,.92);color:#0b1026;font:700 13px system-ui,-apple-system,sans-serif;padding:6px 12px;cursor:pointer}
#kh{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;background:rgba(11,16,38,.86);color:#fff;font:600 13px system-ui,-apple-system,sans-serif;padding:8px 16px;border-radius:99px;transition:opacity .6s}
</style></head><body>
<section class="sl"><img src="slides/01.jpg?v=1794471320" alt="Slide 1"></section>
<section class="sl"><img src="slides/02.jpg?v=1794471320" alt="Slide 2"></section>
<section class="sl"><img src="slides/03.jpg?v=1794471320" alt="Slide 3"></section>
<section class="sl"><img src="slides/04.jpg?v=1794471320" alt="Slide 4"><div class="vid" style="left:792px;top:258px;width:416px;height:234.9px"><video src="video/platform-reel.mp4?v=1794471320" poster="img/reel-poster.jpg?v=1794471320" muted loop playsinline preload="auto" controls></video><button class="grow" type="button">Full size</button></div></section>
<section class="sl"><img src="slides/05.jpg?v=1794471320" alt="Slide 5"></section>
<section class="sl"><img src="slides/06.jpg?v=1794471320" alt="Slide 6"></section>
<section class="sl"><img src="slides/07.jpg?v=1794471320" alt="Slide 7"></section>
<section class="sl"><img src="slides/08.jpg?v=1794471320" alt="Slide 8"></section>
<section class="sl"><img src="slides/09.jpg?v=1794471320" alt="Slide 9"></section>
<section class="sl"><img src="slides/10.jpg?v=1794471320" alt="Slide 10"></section>
<section class="sl"><img src="slides/11.jpg?v=1794471320" alt="Slide 11"></section>
<section class="sl"><img src="slides/12.jpg?v=1794471320" alt="Slide 12"></section>
<section class="sl"><img src="slides/13.jpg?v=1794471320" alt="Slide 13"></section>
<div id="kh">&larr; &rarr; or click to move &middot; F full screen</div>
<script>
(function(){
  var S=[].slice.call(document.querySelectorAll('.sl')),i=0;
  var m=location.hash.match(/(\d+)/); if(m)i=Math.min(S.length-1,Math.max(0,+m[1]-1));
  function fit(){var k=Math.min(innerWidth/1280,innerHeight/720);S.forEach(function(x){x.style.transform='translate(-50%,-50%) scale('+k+')';});}
  function grow(d){d.classList.toggle('big');var b=d.querySelector('.grow');if(b)b.textContent=d.classList.contains('big')?'Smaller':'Full size';}
  function show(n){
    S[i].classList.remove('on');S[i].querySelectorAll('video').forEach(function(v){v.pause();});
    S[i].querySelectorAll('.vid').forEach(function(d){d.classList.remove('big');var b=d.querySelector('.grow');if(b)b.textContent='Full size';});
    i=Math.max(0,Math.min(S.length-1,n));S[i].classList.add('on');
    S[i].querySelectorAll('video').forEach(function(v){v.currentTime=0;v.play();});
    history.replaceState(null,'','#'+(i+1));
  }
  addEventListener('resize',fit);fit();S[i].classList.add('on');show(i);
  addEventListener('keydown',function(e){
    var vv=S[i].querySelector('video');
    if(vv&&(e.key===' '||e.key==='k'||e.key==='K')){vv.paused?vv.play():vv.pause();e.preventDefault();return;}
    if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].indexOf(e.key)>=0){show(i+1);e.preventDefault();}
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].indexOf(e.key)>=0){show(i-1);e.preventDefault();}
    else if(e.key==='Home')show(0);else if(e.key==='End')show(S.length-1);
    else if(e.key==='v'||e.key==='V'){S[i].querySelectorAll('.vid').forEach(grow);}
    else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  });
  addEventListener('click',function(e){var g=e.target.closest&&e.target.closest('.grow');if(g){grow(g.closest('.vid'));return;}if(e.target.closest&&e.target.closest('.vid'))return;show(e.clientX<innerWidth/4?i-1:i+1);});
  setTimeout(function(){var k=document.getElementById('kh');if(k)k.style.opacity=0;},4500);
  setTimeout(function(){var k=document.getElementById('kh');if(k)k.remove();},5200);
})();
</script>
</body></html>
